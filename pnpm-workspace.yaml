packages:
  - "apps/*"
  - "packages/*"
# Dependencies explicitly allowed to run install/build lifecycle scripts. In pnpm v11 the key is
# `allowBuilds` (a map); the v10 `onlyBuiltDependencies` list is deprecated and silently ignored,
# which caused ERR_PNPM_IGNORED_BUILDS on fresh CI installs (ACBP-P0-020 hardening fix).
# esbuild's postinstall installs its platform binary, consumed by tsx (the migration CLI runner).
allowBuilds:
  esbuild: true
  # sharp is a Next.js OPTIONAL image-optimization native dep; apps/web (auth-only) does not use
  # next/image, so its native build is intentionally skipped (ACBP-P1-001). Set true if image
  # optimization is later required and a build toolchain is available.
  sharp: false

# Transitive-dependency remediations. NOT ticket-feature scope — kept here so the required `pnpm audit
# --audit-level high` gate stays green repo-wide.
# sharp <0.35.0: inherited libvips advisories GHSA-f88m-g3jw-g9cj (CVE-2026-33327/33328/35590/35591).
# apps/web does not use next/image, so sharp is an unused optional transitive dep; force the patched line.
overrides:
  sharp: ">=0.35.0"
  # postcss <=8.5.11: GHSA-6g55-p6wh-862q (arbitrary file read via attacker-controlled sourceMappingURL).
  # next pins 8.4.31; force the patched line (advisory published 2026-07-23, blocked the High+ gate).
  postcss: ">=8.5.12"
