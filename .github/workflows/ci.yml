# ACBP-P0-020 — Continuous Integration (checks only; runs no releases and changes no environments).
# Runs every Phase-0 quality/security gate on pull requests and pushes to main, against a real
# isolated PostgreSQL 16 service. See docs/CI.md. No repository secrets are used; fork PRs run with
# read-only permissions and ephemeral, run-scoped database credentials.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # MANUAL TRIGGER, added by ACBP-P7-008 because the repository has now been stopped by its absence TWICE in two
  # days. ACBP-P7-007 could not run exact-main CI after its merge — GitHub created no run anywhere in the
  # repository for over an hour — and recorded the gap in its own execution log: "the workflow has no manual
  # trigger, so an Actions outage is unrecoverable rather than merely slow." ACBP-P7-008 then lost its mutation
  # probe to the 2026-08-06 major Actions outage, in which webhook delivery was throttled to ~15% and NO run was
  # ever created for its branch. A push that produces no run cannot be retried into existence; `gh workflow run`
  # goes through the REST API instead of the webhook path, so it is a genuinely different route to the same
  # checks.
  #
  # IT WORKED ON THE BRANCH THAT ADDED IT, WHICH I DID NOT EXPECT. The commit that introduced this said the
  # opposite — that GitHub only offers `workflow_dispatch` for workflows on the DEFAULT branch, so it could not
  # help until merged. Tested instead of assumed: `gh workflow run ci.yml --ref p7-008-failure-injection-pass`
  # was accepted and created run **31128906516** on `2314ef7`, the first run this branch ever had, during the
  # outage. The claim is corrected here rather than left standing, because a false sentence in a comment is the
  # artefact class this repository keeps paying for.
  #
  # No new capability: the job is checks-only, holds `contents: read`, and uses no repository secrets, so running
  # it by hand can change nothing. It only makes the same verification reachable when webhooks are not.
  workflow_dispatch:

# Cancel superseded runs for the same ref (saves resources; safe for checks-only CI).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repository. No write/deploy/token scopes.
permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      APP_ENV: test
      DATABASE_SSL: disable
      # Run-scoped, obviously-NON-production password derived from non-secret run metadata
      # (not a repository secret). Local-only to the job; never printed.
      PGPASSWORD_RUN: ci-${{ github.run_id }}-${{ github.run_attempt }}
      ACBP_TEST_DATABASE_URL: postgresql://acbp_ci:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/acbp_ci_test
    services:
      postgres:
        image: postgres:16 # PostgreSQL 16.x; pin to an exact patch/digest when hardening (see docs/CI.md)
        env:
          POSTGRES_USER: acbp_ci
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: acbp_ci_test
        ports:
          - 5432:5432
        # Job proceeds only once PostgreSQL is accepting connections.
        options: >-
          --health-cmd "pg_isready -U acbp_ci -d acbp_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      # Third-party actions are pinned to immutable commit SHAs (release tag recorded in the comment),
      # verified via the official GitHub API. To update: re-resolve the tag to its commit SHA from the
      # action's official repository and replace both the SHA and the comment (see docs/CI.md).
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # ACBP-P7-007. `check:trust-critical-index` enforces that MAX_UNPROVEN never RISES by reading its value
      # from origin/main — the thing that makes the word "ratchet" true rather than decorative. The default
      # checkout is depth-1 and has no origin/main ref, so without this the check reports its baseline as
      # unreadable and the no-rise rule silently does not run in the one place it matters. Depth 1 on a single
      # branch keeps it cheap; the checker still says so out loud if the ref is missing rather than passing quietly.
      - name: Fetch main (baseline for the trust-critical ratchet)
        run: git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main || echo "no main ref — the ratchet baseline will report itself unreadable"
      - name: Enable Corepack (activates the pnpm version pinned in package.json "packageManager")
        run: corepack enable
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies (frozen lockfile — a mismatch fails CI)
        run: pnpm install --frozen-lockfile
      - name: CI database preflight (fails if integration tests would silently skip)
        run: pnpm run ci:preflight
      # ACBP-P7-007 (CDR-080 §8 slice 6). The secret scan also runs inside the aggregate gate below, so this is
      # not extra coverage — it is a NAMED, LINKABLE check. Launch gate 12 wants "zero findings on secrets" as
      # evidence, and a green line buried inside a step called "Aggregate gate" cannot be cited as that. It runs
      # BEFORE the aggregate gate so a committed credential fails in seconds rather than after the full suite.
      - name: Secret scan — zero findings (NFR-018; launch gate 12 evidence)
        run: pnpm run check:secrets
      - name: Aggregate gate (typecheck, lint, secret scan, boundaries + regression, contracts, unit, real-PostgreSQL integration + migrations)
        run: pnpm run check
      # ACBP-API-007 — THE PRODUCTION BUILD. Until this step existed, `apps/web` was the one deliverable this
      # pipeline never constructed: every gate above could be green against a web app that does not build.
      #
      # IT RUNS THE PROJECT'S OWN SCRIPT, NEVER `next build`. That is the entire point rather than a style
      # preference. `apps/web` pins `next build --webpack`, and Next 16 defaults to Turbopack, which cannot
      # resolve this repository's workspace barrel re-exports (`next.config.ts:31`). During ACBP-API-003 I ran
      # `pnpm exec next build`, bypassed the pin, and reported a broken build on `main` that was not broken —
      # then "confirmed" it by repeating the same wrong command. A step that invokes the script cannot make that
      # mistake, and a root `build` script exists so there is one canonical entry point to invoke.
      #
      # WHY HERE AND NOT EARLIER. The proposal asked for it after typecheck and lint, because a type error reads
      # more clearly than the bundler failure it would also cause. Those two live INSIDE the aggregate gate above
      # alongside the test suite, so "after typecheck, before the tests" is not a position this workflow has
      # without splitting that step. Placed after it instead — the ordering the proposal wanted, at the cost of
      # waiting out the tests. Noted rather than silently reinterpreted.
      #
      # IT NEEDS NO SECRETS AND NO DATABASE. Verified before adding: the build completes on a bare environment
      # with neither Clerk key and no `DATABASE_APP_URL` (exit 0, ~24s locally). So this step preserves the
      # header's claim that the workflow uses no repository secrets.
      #
      # A RED HERE REPORTS THE STATE OF THE DIFF, not the state of the world — the opposite of the advisory gate
      # below, which has twice reddened branches that changed no dependency. Do not treat the two the same way.
      - name: Production build (apps/web; the project's --webpack-pinned script, never bare `next build`)
        run: pnpm run build
      # ACBP-P1-015 acceptance criterion ("Demo script passes E2E incl. live denial") and its verification
      # procedure ("Run demo script"). The journey is shared with the CI suite, but running the SCRIPT is what
      # proves the artifact the backlog names is actually executable — a demo that only ever ran on someone's
      # machine is not evidence. It resets its own disposable schema, so it runs after the aggregate gate.
      - name: Slice A demo (M1 exit journey, ending in a live cross-tenant denial)
        run: pnpm run demo:slice-a
      - name: Dependency advisories (High and above block)
        run: pnpm audit --audit-level high
